<script type="text/javascript">
	$(document).ready(function(){
		//-------------------------------------------------------------- Loop on all checkboxes and save its value and id into array
		$('input[type="checkbox"]').each(function(){
			var id = $(this).attr("id");
			if (localStorage.getItem(id) !== null){
				$('input[type="checkbox"][value="'+localStorage.getItem(id)+'"]').prop("checked",true);
			}
		});		
		
		//-------------------------------------------------------------- Count the checked checkboxes on document ready and store href on var [This step must be done after getting local storage value]
		var nextPageLink = $(".nextButton").attr("href");	
		var check = $('input[type="checkbox"]:checked').length;		
		if (check == 0){
			$(".nextButton").removeAttr("href");
		} else {
			$(".nextButton").attr("href",nextPageLink);
		}
				
		//-------------------------------------------------------------- Remove / Add nextButton href depending on checkboxes check
		$('input[type="checkbox"]').change(function(){
			check = 0;
			$('input[type="checkbox"]').each(function(){
				if ($(this).is(":checked")) check+=1;
			});
			if (check == 0){
				$(".nextButton").removeAttr("href");
			} else {
				$(".nextButton").attr("href",nextPageLink);
			}
		});	
	});
	
	//-------------------------------------------------------------- Store local storage value on change
	$('input[type="checkbox"]').change(function(){
		var id = $(this).attr("id");
		var val = $(this).val();
		if (localStorage.getItem(id) === null) {
		localStorage.setItem(id, val);
		skills8_ar.push(val);
		localStorage.setItem("skills8_ar", JSON.stringify(skills8_ar));
		}
	});
    $(document).on('ready', function() {$('#back-btn').on('click', function(e) {window.history.go(-1);return false;})

        dots: true,

        infinite: true,
        centerMode: true,
        slidesToShow: 1,
        slidesToScroll: 1,
		/*autoplay: true,
		autoplaySpeed: 3000,*/
      });
		$(".lazy").slick({
        lazyLoad: 'ondemand', // ondemand progressive anticipated
        infinite: true
      });
	});
</script>
