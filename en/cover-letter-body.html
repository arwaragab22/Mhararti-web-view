<script>
  var monthNames = ["January", "February", "March", "April", "May", "June",

  window.onload=function(){

    cvbuilder=readystate();
let gender=["Sir/ Madam","Mr.","Ms.","Mr./Ms."];

      console.log( monthNames[cvbuilder.coverletteren.submitdate.split("-")[1]-1]+"  -  "+cvbuilder.coverletteren.submitdate.split("-")[2]+"-"+cvbuilder.coverletteren.submitdate.split("-")[0]);
document.getElementsByClassName("gover")[0].innerHTML=cvbuilder.coverletteren.personalinformation.governoratenamecoverletteren;

    document.getElementsByClassName("tel")[0].innerHTML=cvbuilder.coverletteren.personalinformation.phone;

    document.getElementsByClassName("email")[0].innerHTML=cvbuilder.coverletteren.personalinformation.email;
    document.getElementsByClassName("date")[0].innerHTML= monthNames[cvbuilder.coverletteren.submitdate.split("-")[1]-1]+" "+cvbuilder.coverletteren.submitdate.split("-")[2]+","+cvbuilder.coverletteren.submitdate.split("-")[0]
  
    document.getElementsByClassName("postal")[0].innerHTML=cvbuilder.coverletteren.personalinformation.zipcode;
    document.getElementsByClassName("name")[0].innerHTML=cvbuilder.coverletteren.personalinformation.fullname;
    document.getElementsByClassName("name")[1].innerHTML=cvbuilder.coverletteren.personalinformation.fullname;

    document.getElementsByClassName("intro")[0].innerHTML=cvbuilder.coverletteren.introductioninformation.introduction.replaceAll("\n","<br>");
    document.getElementsByClassName("body")[0].innerHTML=cvbuilder.coverletteren.bodyinformation.xbody.replaceAll("\n","<br>");;
    document.getElementsByClassName("closing")[0].innerHTML=cvbuilder.coverletteren.closinginformation.closing.replaceAll("\n","<br>");;
    if(cvbuilder.coverletteren.employerinformation){
    if(gender[parseInt(cvbuilder.coverletteren.employerinformation.em_gender)]){
      if(cvbuilder.coverletteren.employerinformation.em_name!=""){
        document.getElementsByClassName("dear")[0].innerHTML=gender[parseInt(cvbuilder.coverletteren.employerinformation.em_gender)];
      }
   
      document.getElementsByClassName("dear")[1].innerHTML=gender[parseInt(cvbuilder.coverletteren.employerinformation.em_gender)];
    }
    else{
      document.getElementsByClassName("dear")[1].innerHTML=gender[0]+"،";
     


 
    }
    if(cvbuilder.coverletteren.employerinformation.em_name){
      document.getElementsByClassName("hr")[0].innerHTML=cvbuilder.coverletteren.employerinformation.em_name+",";
      document.getElementsByClassName("hr")[1].innerHTML=cvbuilder.coverletteren.employerinformation.em_name+",";

    }
  }
 
    else{
      document.getElementsByClassName("dear")[0].innerHTML=gender[0]+"،";
     


 
    }

    if(cvbuilder.coverletteren.employerinformation){
    if(cvbuilder.coverletteren.employerinformation.em_name){
      document.getElementsByClassName("hr")[0].innerHTML=cvbuilder.coverletteren.employerinformation.em_name+",";
    }
 
    if(cvbuilder.coverletteren.employerinformation.em_jobtitle){
      document.getElementsByClassName("employeerjob")[0].innerHTML=cvbuilder.coverletteren.employerinformation.em_jobtitle+",";
    }
    if(cvbuilder.coverletteren.employerinformation.em_coname){
      document.getElementsByClassName("employeerjobaddress")[0].innerHTML=cvbuilder.coverletteren.employerinformation.em_coname;
    }
    if(cvbuilder.coverletteren.employerinformation.em_coaddress){
      document.getElementsByClassName("employeeraddress")[0].innerHTML=cvbuilder.coverletteren.employerinformation.em_coaddress;

}

if(cvbuilder.coverletteren.personalinformation.phone==""){
